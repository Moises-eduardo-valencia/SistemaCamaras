{% extends "base.html" %}

{% block title %}Eliminar Destinatario{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 shadow rounded-lg text-center">
  <div class="text-5xl mb-4">⚠️</div>
  <h2 class="text-xl font-bold text-gray-800 mb-4">Confirmar Eliminación</h2>
  <p class="text-gray-700 mb-2">
    ¿Eliminar a <strong>{{ dest.email }}</strong> de la empresa <strong>{{ dest.empresa }}</strong>?
  </p>
  <p class="text-sm text-gray-500 mb-6">Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit"
            class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700 mr-3">
      Sí, eliminar
    </button>
    <a href="{% url 'lista_destinatarios' %}"
       class="border border-gray-300 px-6 py-2 rounded hover:bg-gray-50 text-gray-700">
      Cancelar
    </a>
  </form>
</div>
{% endblock %}
