{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento Registrado</title>
  <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center px-4">

  <div class="bg-white shadow-lg rounded-xl w-full max-w-sm text-center px-8 py-10">
    <div class="text-6xl mb-4">✅</div>
    <h1 class="text-xl font-bold text-green-700 mb-2">¡Mantenimiento registrado!</h1>
    <p class="text-gray-600 text-sm mb-1">Cámara: <strong>{{ camara.nombre }}</strong></p>
    <p class="text-gray-600 text-sm mb-6">Empresa: <strong>{{ camara.empresa }}</strong></p>
    <p class="text-gray-500 text-sm mb-8">El registro fue guardado correctamente.</p>
    <a href="{% url 'mantenimiento_rapido' token=camara.token %}"
       class="block w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition text-sm">
      Registrar otro mantenimiento
    </a>
  </div>

</body>
</html>
